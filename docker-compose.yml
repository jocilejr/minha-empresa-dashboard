# ============================================
# Origem Viva Dashboard - Docker Compose
# ============================================

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: origem-viva-dashboard
    restart: unless-stopped
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
